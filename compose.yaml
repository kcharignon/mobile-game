name: petitsjeux

services:
  # Application Android (android/) : `make android` (APK de débogage dans dist/), `make android-test` (tests unitaires Kotlin),
  # `make android-screenshots` (captures des écrans), `make android-release` / `android-release-verify` / `android-release-selftest`
  # (APK signé : android/PUBLICATION.md).
  # Les trois services partagent UNE image (petitsjeux-android:latest) : la CI la construit une fois (avec cache) et les commandes make la réutilisent.
  # Image JDK 17 + SDK Android ; le cache de Gradle (et la clé de débogage, donc la signature de l'APK) vit dans le volume android-gradle.
  android:
    profiles: [android]
    image: petitsjeux-android:latest
    build:
      context: ./android
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /work/android
    # Les variables sans valeur sont reprises de l'environnement de l'appelant (CI, terminal), jamais écrites ici :
    # étiquette et code de version, clé de signature (secrets GitHub) et empreinte PUBLIQUE du certificat attendu.
    environment:
      - ANDROID_VERSION_TAG
      - ANDROID_VERSION_CODE
      - ANDROID_KEYSTORE_BASE64
      - ANDROID_KEYSTORE_PASSWORD
      - ANDROID_KEY_ALIAS
      - ANDROID_KEY_PASSWORD
      - ANDROID_EXPECTED_CERT_SHA256
    volumes:
      - ./android:/work/android
      - ./dist:/work/dist
      - android-gradle:/gradle
    command: ["./build.sh", "apk"]

  android-test:
    profiles: [android]
    image: petitsjeux-android:latest
    build:
      context: ./android
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /work/android
    volumes:
      - ./android:/work/android
      - android-gradle:/gradle
    command: ["./build.sh", "test"]

  # Rend les écrans en PNG avec Robolectric (sans téléphone) : docs/screenshots/.
  android-screenshots:
    profiles: [android]
    image: petitsjeux-android:latest
    build:
      context: ./android
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /work/android
    volumes:
      - ./android:/work/android
      - ./docs/screenshots:/work/docs/screenshots
      - android-gradle:/gradle
    command: ["./build.sh", "screenshots"]

volumes:
  android-gradle:
