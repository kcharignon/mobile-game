name: Android

# Application Android (android/). Séparé de ci.yml :
#   - « debug » joue les tests Kotlin puis construit l'APK de débogage, avec les mêmes commandes que `make android-test` et `make android` ;
#   - « release » prouve que la publication refuse de se construire sans clé de signature et réussit avec une clé jetable créée dans le job
#     (`make android-release-selftest`) ; aucune vraie clé n'est utilisée ici ;
#   - « prerelease » (déclenchement à la main sur main seulement, `gh workflow run android.yml --ref main`) publie l'APK de débogage dans une
#     pré-version GitHub `android-dev-<date>` : jamais une release de production.
# La publication SIGNÉE (étiquette `android-vX.Y.Z`, clé de l'utilisateur en secrets) est un autre workflow : android-release.yml (android/PUBLICATION.md).
# L'image de construction (JDK, SDK Android) est lourde : ses couches sont gardées dans le cache de GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette de la pré-version de débogage : android-dev-AAAA-MM-JJ, suivie au besoin d'une lettre (android-dev-2026-11-06b). Vide : la date du jour."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - android/**
      - tools/design/**
      - .github/workflows/android.yml
      - compose.yaml
      - Makefile
  pull_request:
    paths:
      - android/**
      - tools/design/**
      - .github/workflows/android.yml
      - compose.yaml
      - Makefile

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Tests Kotlin et APK de débogage (Docker)
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.apk.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Le nom de l'image est celui que compose lui donne (projet « petitsjeux », service « android ») : `make` la trouve déjà construite.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./android
          load: true
          tags: petitsjeux-android:latest
          cache-from: type=gha,scope=android
          cache-to: type=gha,scope=android,mode=max
      # Les véhicules sont décrits une seule fois (tools/design/vehicles.js) : le Kotlin et la planche d'aperçu en sont générés.
      - name: Les véhicules générés sont à jour
        run: |
          node tools/design/make-vehicles.js
          git diff --exit-code -- android/app/src/main/java/com/kcharignon/petitsjeux/games/parking/ui/VehicleArt.kt docs/design/vehicules.svg
      - name: Tests Kotlin
        run: make android-test ANDROID_BUILD=
      # Joue l'interface sans téléphone (Robolectric) : parcours complets (créer un joueur, finir un niveau, sauvegarde) et captures des écrans.
      - name: Interface, parcours et captures d'écran
        run: make android-screenshots ANDROID_BUILD=
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: captures-ecran
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: APK de débogage
        env:
          # Le numéro monte à chaque exécution ; sans étiquette, la version est « 0.0.0-dev ».
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: make android ANDROID_BUILD=
      - name: Taille et empreinte
        id: apk
        run: |
          set -euo pipefail
          apk=dist/petitsjeux-debug.apk
          sha256=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "APK de débogage : $(stat -c %s "$apk") octets, SHA-256 $sha256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: petitsjeux-debug
          path: dist/petitsjeux-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publication refusée sans clé, réussie avec une clé jetable (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./android
          load: true
          tags: petitsjeux-android:latest
          cache-from: type=gha,scope=android
          cache-to: type=gha,scope=android,mode=max
      - name: Essai de la publication
        run: make android-release-selftest ANDROID_BUILD=

  prerelease:
    name: Pré-version GitHub de l'APK de débogage
    needs: debug
    # À la main (workflow_dispatch) et seulement depuis main : une pré-version n'est jamais une release de production, et son étiquette
    # (android-dev-<date>) n'est ni vX.Y.Z ni android-vX.Y.Z.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: petitsjeux-debug
      - name: Publier la pré-version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA256: ${{ needs.debug.outputs.sha256 }}
          RUN_NUMBER: ${{ github.run_number }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Le fichier téléchargé est bien celui que le job précédent a construit.
          echo "${SHA256}  petitsjeux-debug.apk" | sha256sum -c -
          date=$(date -u +%Y-%m-%d)
          if [ -n "${TAG_INPUT}" ]; then
            # Une étiquette choisie à la main : de la forme android-dev-AAAA-MM-JJ[lettre], jamais vX.Y.Z ni android-vX.Y.Z, jamais déjà prise.
            if ! [[ "${TAG_INPUT}" =~ ^android-dev-[0-9]{4}-[0-9]{2}-[0-9]{2}[a-z]?$ ]]; then
              echo "Étiquette refusée : il faut android-dev-AAAA-MM-JJ, suivie au besoin d'une lettre." >&2
              exit 1
            fi
            tag="${TAG_INPUT}"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "L'étiquette $tag existe déjà." >&2
              exit 1
            fi
          else
            tag="android-dev-${date}"
            n=1
            while gh release view "$tag" > /dev/null 2>&1; do
              n=$((n + 1))
              tag="android-dev-${date}-${n}"
            done
          fi
          cat > notes.md <<NOTES
          **Version d'essai : ne pas l'installer à la place de la version publiée.** Elle est signée d'une clé de débogage PUBLIQUE (n'importe qui peut fabriquer un fichier qui s'installe par-dessus) et l'application est débogable. La version à installer est une \`android-vX.Y.Z\` (sans mention « Pre-release »). Mode d'emploi : https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/android/PUBLICATION.md

          APK de débogage de Petits Jeux, pour essayer une version avant sa publication.

          - Empreinte SHA-256 de \`petitsjeux-debug.apk\` : \`${SHA256}\`
          - Construit depuis le commit \`${GITHUB_SHA}\` (numéro de version de l'application : ${RUN_NUMBER})

          L'APK est signé avec la clé de débogage publique du dépôt (mot de passe \`android\`) : elle ne protège rien.
          NOTES
          gh release create "$tag" petitsjeux-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Petits Jeux, essai de débogage ${tag#android-dev-}" \
            --notes-file notes.md
          echo "Pré-version : https://github.com/${GH_REPO}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
