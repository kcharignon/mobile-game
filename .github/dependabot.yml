version: 2
# Aucune montée MAJEURE automatique, nulle part : la chaîne Android (JDK, Gradle, plugin Android, Kotlin, Compose) se monte d'un bloc,
# à la main, en vérifiant que tout se construit ensemble. Dependabot ne propose que des montées mineures et correctives.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # L'application Android (android/) : plugins et bibliothèques de Gradle, une proposition à la fois.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # L'image de construction Android : le JDK reste en 17 (celui que visent AGP 8 et Gradle 8).
  - package-ecosystem: docker
    directory: /android
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
