name: Android release

# Publication SIGNÉE de l'application Petits Jeux : la seule que tu installes pour de bon. Elle est déclenchée UNIQUEMENT par une étiquette
# `android-vX.Y.Z` poussée par toi (`git push origin android-v0.1.0`) : jamais par une PR, jamais par `main`, jamais à la main, et il n'y a
# aucune variante qui publierait sans clé. Procédure pas à pas : android/PUBLICATION.md. Les pré-versions de débogage (android.yml,
# `android-dev-<date>`) sont d'une autre famille, signée d'une clé publique.
#
# Deux travaux, pour que le secret et le droit d'écrire ne se croisent jamais :
#   - « build » (lecture seule) tient les quatre secrets de signature dans l'environnement des deux seules étapes qui en ont besoin, construit l'APK
#     avec `make android-release` (code de version tiré de l'étiquette) puis le contrôle (`make android-release-verify` : certificat de signature
#     attendu, version, permissions, rien de débogage) ;
#   - « publish » (écriture) n'a aucun secret : il publie l'APK contrôlé, son empreinte et `version.json`, puis relit ce qui est publié.
#     L'APK est publié sous deux noms, octet pour octet le même fichier : `petitsjeux.apk` (nom stable, pour les liens) et
#     `petitsjeux-X.Y.Z.apk` (le nom dit la version), copié APRÈS la signature et le contrôle.
#     Puis il tient à jour la release « android-latest » (adresses fixes vers la dernière version : elle contient toujours les cinq fichiers de
#     la dernière version et jamais un mélange de deux ; jamais « Latest »). C'est elle que le lien « dernière version » du README pointe.
# L'empreinte (publique) du certificat attendu est celle de android/release-cert.sha256, relue en PR : une mauvaise clé dans les secrets arrête
# tout avant la publication. Aucune valeur secrète n'est affichée : aucune commande n'écrit un secret.
on:
  push:
    tags:
      - 'android-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  # Une publication commencée n'est jamais interrompue.
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: APK signé et contrôlé (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Environnement GitHub « android-release » (créé au premier passage) : on peut y exiger une approbation avant chaque publication.
    environment: android-release
    steps:
      - name: Secrets de signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Seuls les NOMS manquants sont écrits, jamais une valeur.
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Pas de clé de signature::Secret(s) GitHub manquant(s) : ${missing[*]}. Une publication se signe avec ta clé, jamais sans. Procédure pas à pas : https://github.com/${GITHUB_REPOSITORY}/blob/main/android/PUBLICATION.md (étapes 1 à 3). Rien n'a été construit ni publié."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Étiquette, commit et numéro de version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error title=Étiquette refusée::$*"; exit 1; }
          [[ "$TAG" =~ ^android-v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]] \
            || fail "« $TAG » n'est pas une version android-vX.Y.Z (par exemple android-v0.1.0)."
          # On ne publie que ce qui a été relu et fusionné : le commit de l'étiquette est dans main.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || fail "le commit de l'étiquette $TAG n'est pas dans main : on ne publie que ce qui a été relu et fusionné."
          # Le code de version vient de l'étiquette et ne doit jamais baisser : une version plus ancienne que la dernière publiée ne se mettrait pas par-dessus.
          latest=$(git tag --list 'android-v*' | grep -E '^android-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sed 's/^android-v//' | sort -V | tail -n 1)
          [ "$latest" = "${TAG#android-v}" ] || fail "une étiquette plus récente existe déjà : android-v$latest. Une version plus ancienne ne s'installerait pas par-dessus."
          if gh release view "$TAG" > /dev/null 2>&1; then
            fail "une release $TAG existe déjà. Pour republier, choisir un numéro plus grand (android/PUBLICATION.md)."
          fi

      - name: Empreinte du certificat attendu
        run: |
          # L'empreinte (publique) de ta clé de publication : android/release-cert.sha256, une par ligne, relue en PR avant la première version.
          file=android/release-cert.sha256
          if [ ! -s "$file" ]; then
            echo "::error title=release-cert.sha256 manque::android/release-cert.sha256 n'existe pas (ou est vide) : l'empreinte du certificat attendu y est écrite. À commiter avant la première version (android/PUBLICATION.md, étape 2). Rien n'a été construit ni publié."
            exit 1
          fi
          if grep -vqE '^([0-9A-F]{2}:){31}[0-9A-F]{2}$' "$file"; then
            echo "::error title=release-cert.sha256 mal formé::Chaque ligne doit être une empreinte SHA-256 « AA:BB:… » (32 groupes de deux caractères). Voir android/PUBLICATION.md, étape 2."
            exit 1
          fi
          echo "ANDROID_EXPECTED_CERT_SHA256=$(paste -sd, "$file")" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./android
          load: true
          tags: petitsjeux-android:latest
          cache-from: type=gha,scope=android
          cache-to: type=gha,scope=android,mode=max

      - name: Tests Kotlin
        run: make android-test ANDROID_BUILD=

      - name: APK signé
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Le nom ET le code de version viennent de l'étiquette (android/PUBLICATION.md).
          ANDROID_VERSION_TAG: ${{ github.ref_name }}
        run: make android-release ANDROID_BUILD=

      - name: Contrôle de l'APK (certificat attendu, permissions, version)
        env:
          ANDROID_VERSION_TAG: ${{ github.ref_name }}
        run: make android-release-verify ANDROID_BUILD=

      - name: Fichiers et notes de la release
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          facts=dist/release-facts.env
          fact() { grep "^$1=" "$facts" | cut -d= -f2-; }
          name=$(fact VERSION_NAME); code=$(fact VERSION_CODE); sha256=$(fact APK_SHA256); cert=$(fact CERT_SHA256)
          mkdir -p release
          cp dist/petitsjeux.apk release/petitsjeux.apk
          (cd release && sha256sum petitsjeux.apk > petitsjeux.apk.sha256)
          [ "$(cut -d' ' -f1 release/petitsjeux.apk.sha256)" = "$sha256" ] || { echo "::error::L'empreinte du fichier ne correspond pas au contrôle."; exit 1; }
          # Le même fichier sous un nom qui dit la version (petitsjeux-X.Y.Z.apk) : une COPIE de l'APK déjà signé et contrôlé ci-dessus, jamais une
          # seconde construction ni une seconde signature. Le nom stable petitsjeux.apk reste publié tel quel (liens, version.json).
          version="${TAG#android-v}"
          [ "$version" = "$name" ] || { echo "::error::La version de l'étiquette ($version) n'est pas celle de l'APK contrôlé ($name)."; exit 1; }
          versioned="petitsjeux-${version}.apk"
          cp release/petitsjeux.apk "release/${versioned}"
          cmp release/petitsjeux.apk "release/${versioned}"
          (cd release && sha256sum "${versioned}" > "${versioned}.sha256")
          [ "$(cut -d' ' -f1 "release/${versioned}.sha256")" = "$sha256" ] || { echo "::error::L'empreinte du fichier nommé par sa version ne correspond pas au contrôle."; exit 1; }
          jq -n --arg versionName "$name" --argjson versionCode "$code" \
            --arg apkUrl "https://github.com/${REPO}/releases/download/${TAG}/petitsjeux.apk" --arg sha256 "$sha256" \
            '{versionName: $versionName, versionCode: $versionCode, apkUrl: $apkUrl, sha256: $sha256, minAndroid: 26}' > release/version.json
          cat > release/notes.md <<NOTES
          Application Android Petits Jeux ${name} (numéro de version ${code}), signée de la clé de publication.

          **Installer** : sur le téléphone, télécharger \`${versioned}\` (rubrique « Assets » plus bas), l'ouvrir et autoriser l'installation depuis Chrome ; **mettre à jour** : même geste, par-dessus. \`petitsjeux.apk\` est le même fichier sous un nom qui ne change pas (pour les liens). Pas à pas : https://github.com/${REPO}/blob/${GITHUB_SHA}/android/PUBLICATION.md

          - Empreinte SHA-256 de \`${versioned}\` et de \`petitsjeux.apk\` (identiques) : \`${sha256}\` (\`sha256sum -c ${versioned}.sha256\` la vérifie)
          - Certificat de signature, empreinte SHA-256 : \`${cert}\`
          - Construit depuis le commit \`${GITHUB_SHA}\`

          Les pré-versions \`android-dev-…\` sont signées d'une clé de débogage publique : ne jamais les installer à la place de cette version.
          NOTES
          cat release/version.json
          echo "APK signé : ${name} (code ${code}), SHA-256 ${sha256}, certificat ${cert}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-release
          path: |
            release/petitsjeux.apk
            release/petitsjeux.apk.sha256
            release/petitsjeux-*.apk
            release/petitsjeux-*.apk.sha256
            release/version.json
            release/notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Release GitHub
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-release
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Le fichier téléchargé est bien celui que le travail précédent a construit et contrôlé.
          sha256sum -c petitsjeux.apk.sha256
          versioned="petitsjeux-${TAG#android-v}.apk"
          sha256sum -c "${versioned}.sha256"
          cmp petitsjeux.apk "${versioned}"
          # Une release « normale » : ni brouillon ni pré-version, sans prendre l'étiquette « Latest » à une autre famille de releases.
          gh release create "$TAG" petitsjeux.apk petitsjeux.apk.sha256 "${versioned}" "${versioned}.sha256" version.json \
            --verify-tag \
            --title "Petits Jeux Android ${TAG#android-v}" \
            --notes-file notes.md \
            --latest=false
          # On relit ce qui est publié : ce n'est ni un brouillon ni une pré-version, et l'APK téléchargé a l'empreinte annoncée.
          [ "$(gh release view "$TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = "false" ] \
            || { echo "::error::La release $TAG est un brouillon ou une pré-version."; exit 1; }
          mkdir published
          gh release download "$TAG" --dir published --pattern petitsjeux.apk --pattern petitsjeux.apk.sha256 --pattern "${versioned}" --pattern "${versioned}.sha256"
          (cd published && sha256sum -c petitsjeux.apk.sha256 && sha256sum -c "${versioned}.sha256")
          cmp petitsjeux.apk published/petitsjeux.apk
          cmp petitsjeux.apk "published/${versioned}"
          echo "Release : https://github.com/${GH_REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
      - name: Mettre à jour la release roulante android-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Des adresses FIXES vers « la dernière version », sans connaître son numéro (lien du README) :
          #   https://github.com/<dépôt>/releases/download/android-latest/<fichier>
          # La release « android-latest » ne ressemble pas au déclencheur (android-vX.Y.Z) : elle ne relance rien. Elle n'est jamais « Latest ».
          # Aucune signature ni construction ici : on ne copie que les fichiers déjà signés, contrôlés et publiés ci-dessus.
          rolling=android-latest
          version="${TAG#android-v}"
          versioned="petitsjeux-${version}.apk"
          sha256sum -c petitsjeux.apk.sha256
          sha256sum -c "${versioned}.sha256"
          cmp petitsjeux.apk "${versioned}"
          expected=$(printf '%s\n' petitsjeux.apk petitsjeux.apk.sha256 "${versioned}" "${versioned}.sha256" version.json | sort)
          title="Petits Jeux Android, dernière version (adresses fixes)"
          cat > notes-latest.md <<NOTES
          Cette release est mise à jour à chaque nouvelle version de l'application Android Petits Jeux : elle contient toujours les fichiers de la dernière (actuellement **${version}**), pour des adresses qui ne changent pas. Pour installer à la main, prends plutôt la release de la version : https://github.com/${GH_REPO}/releases/tag/${TAG}

          - \`https://github.com/${GH_REPO}/releases/download/${rolling}/petitsjeux.apk\`
          - \`https://github.com/${GH_REPO}/releases/download/${rolling}/petitsjeux.apk.sha256\`
          - \`https://github.com/${GH_REPO}/releases/download/${rolling}/${versioned}\`
          - \`https://github.com/${GH_REPO}/releases/download/${rolling}/${versioned}.sha256\`
          - \`https://github.com/${GH_REPO}/releases/download/${rolling}/version.json\`

          Mêmes fichiers, octet pour octet, que la release ${TAG}. Construit depuis le commit \`${COMMIT}\`.
          NOTES
          if ! gh release view "$rolling" > /dev/null 2>&1; then
            # Première fois : tout d'un coup. L'étiquette est créée sur ce commit (une étiquette créée par le jeton du workflow ne lance aucun workflow).
            gh release create "$rolling" petitsjeux.apk petitsjeux.apk.sha256 "${versioned}" "${versioned}.sha256" version.json \
              --target "$COMMIT" --title "$title" --notes-file notes-latest.md --latest=false
          else
            # Ordre : d'abord les fichiers au nom nouveau, puis le nom stable (l'APK puis son empreinte), et version.json EN DERNIER (c'est lui
            # qui annonce la version : il ne change que quand tout le reste est en place).
            gh release upload "$rolling" "${versioned}" --clobber
            gh release upload "$rolling" "${versioned}.sha256" --clobber
            gh release upload "$rolling" petitsjeux.apk --clobber
            gh release upload "$rolling" petitsjeux.apk.sha256 --clobber
            gh release upload "$rolling" version.json --clobber
            # Les fichiers versionnés des versions précédentes sont retirés : la release ne mélange jamais deux versions.
            gh release view "$rolling" --json assets --jq '.assets[].name' | while read -r asset; do
              if ! grep -qxF "$asset" <<<"$expected"; then
                gh release delete-asset "$rolling" "$asset" --yes
              fi
            done
            gh release edit "$rolling" --title "$title" --notes-file notes-latest.md --latest=false
          fi
          # On relit ce qui est publié : exactement les cinq fichiers, pas de brouillon, jamais « Latest », et les mêmes octets que ceux contrôlés.
          [ "$(gh release view "$rolling" --json assets --jq '.assets[].name' | sort)" = "$expected" ] \
            || { echo "::error::La release $rolling ne contient pas exactement les cinq fichiers de la version ${version}."; exit 1; }
          [ "$(gh release view "$rolling" --json isDraft --jq '.isDraft')" = "false" ] \
            || { echo "::error::La release $rolling est un brouillon."; exit 1; }
          [ "$(gh api "repos/${GH_REPO}/releases/latest" --jq '.tag_name' 2> /dev/null || true)" != "$rolling" ] \
            || { echo "::error::La release $rolling a pris l'étiquette « Latest »."; exit 1; }
          mkdir published-latest
          gh release download "$rolling" --dir published-latest
          (cd published-latest && sha256sum -c petitsjeux.apk.sha256 && sha256sum -c "${versioned}.sha256")
          for file in petitsjeux.apk petitsjeux.apk.sha256 "${versioned}" "${versioned}.sha256" version.json; do
            cmp "$file" "published-latest/$file"
          done
          # Et l'adresse fixe, celle que le README donne, répond avec ces octets-là (quelques essais : le temps que le relais se mette à jour).
          mkdir fixed-address
          for file in petitsjeux.apk version.json; do
            ok=false
            for _ in 1 2 3 4 5 6; do
              if curl -fsSL --retry 3 -o "fixed-address/$file" "https://github.com/${GH_REPO}/releases/download/${rolling}/${file}" && cmp -s "$file" "fixed-address/$file"; then
                ok=true; break
              fi
              sleep 10
            done
            "$ok" || { echo "::error::L'adresse fixe https://github.com/${GH_REPO}/releases/download/${rolling}/${file} ne répond pas avec le bon fichier."; exit 1; }
          done
          echo "Release roulante : https://github.com/${GH_REPO}/releases/tag/${rolling} (version ${version})" >> "$GITHUB_STEP_SUMMARY"
